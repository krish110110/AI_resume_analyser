<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AI Resume Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-wrapper">
            <div class="auth-card card-glass gradient-border">
                <div class="auth-header">
                    <div class="logo">RA</div>
                    <h2>Reset password</h2>
                    <p>Enter your email and we'll send you a reset link</p>
                </div>
                <form id="forgotForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg">Send Reset Link</button>
                </form>
                <div class="auth-footer">
                    <a href="login.html">← Back to login</a>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth/login.js"></script>
    <script>initForgot();</script>
</body>
</html>
