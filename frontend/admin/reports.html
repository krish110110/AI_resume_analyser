<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/admin-dashboard.css">
    <link rel="stylesheet" href="../css/report.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-brand"><span class="nav-brand-mark">RA</span> Admin Console</div>
            <nav class="admin-sidebar-nav">
                <a href="dashboard.html" class="admin-nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span> Dashboard</a>
                <a href="users.html" class="admin-nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg></span> Users</a>
                <a href="reports.html" class="admin-nav-item active"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></span> Reports</a>
                <a href="analytics.html" class="admin-nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></span> Analytics</a>
                <a href="models.html" class="admin-nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg></span> Models</a>
                <a href="#" id="logoutBtn" class="admin-nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></span> Sign out</a>
            </nav>
        </aside>
        <main class="admin-main">
            <header class="admin-top-bar">
                <div>
                    <h1>All Reports</h1>
                    <p class="text-muted mt-1">Every analysed resume across the platform</p>
                </div>
            </header>
            <section class="admin-section">
                <div class="admin-table-controls">
                    <input type="search" id="reportSearch" placeholder="Search by filename...">
                    <button id="refreshReports" class="admin-btn admin-btn-secondary">Refresh</button>
                </div>
                <div id="reportsTable" class="admin-table-wrapper">
                    <p class="text-muted">Loading reports...</p>
                </div>
                <p class="text-muted mt-3" style="font-size:12px;">Click any row to open the full resume, parsed details and interview questions.</p>
            </section>
        </main>
    </div>
    <div id="reportDetailsModal" class="admin-modal" style="display:none;">
        <div class="admin-modal-content" style="max-width: 900px;">
            <div class="admin-modal-header">
                <h3 id="reportDetailTitle">Resume Details</h3>
                <button class="admin-modal-close" onclick="closeReportDetails()">&times;</button>
            </div>
            <div class="admin-modal-body" id="reportDetailBody">
                <p class="text-muted">Loading...</p>
            </div>
            <div class="admin-modal-footer">
                <button class="admin-btn admin-btn-secondary" onclick="closeReportDetails()">Close</button>
            </div>
        </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth/auth-guard.js"></script>
    <script src="../js/admin/report-details.js"></script>
    <script src="../js/admin/reports.js"></script>
    <script>initAdminReports();</script>
</body>
</html>
